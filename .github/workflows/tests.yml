name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install the libraries the tests exercise
        # Without these the tests that need them are skipped, not failed.
        run: python3 -m pip install numpy matplotlib requests beautifulsoup4 eccodes pyyaml
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t . -v
