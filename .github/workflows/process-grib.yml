name: Process ALADIN GRIB Files

on:
  schedule:
    - cron: '5 * * * *'  # Every hour at :05 (GitHub fires only a few of these per day)
  workflow_dispatch:  # Manual trigger
    inputs:
      dry_run:
        description: "Build and assemble everything, but do not deploy or save markers"
        type: boolean
        default: false
      force:
        description: "Process both assets even if the latest run was already processed"
        type: boolean
        default: false
      simulate:
        description: "With dry_run: make this job fail, to test that the previous file is kept"
        type: choice
        options: [none, wind, marine]
        default: none

# One pipeline per branch at a time: a long run delays the next one instead of racing it,
# and a test run on another branch can never cancel or replace a pending production run.
concurrency:
  group: aladin-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Only runs on main that are not dry runs may deploy gh-pages or save markers.
  DEPLOY: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      timestamp: ${{ steps.checker.outputs.timestamp }}
      need_wind: ${{ steps.decide.outputs.need_wind }}
      need_marine: ${{ steps.decide.outputs.need_marine }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build checker image
        run: |
          docker buildx build \
            --file Dockerfile.checker \
            --tag aladin-checker:latest \
            --cache-from type=gha,scope=checker \
            --cache-to type=gha,mode=max,scope=checker \
            --load \
            .

      - name: Run availability check
        id: checker
        run: |
          ts=$(docker run --rm aladin-checker:latest 2>/tmp/checker.log) && rc=0 || rc=$?
          cat /tmp/checker.log
          echo "timestamp=${ts}" >> $GITHUB_OUTPUT

      - name: Check if wind was already processed
        id: wind_marker
        if: steps.checker.outputs.timestamp != ''
        uses: actions/cache/restore@v6
        with:
          path: .processed-marker
          key: processed-${{ steps.checker.outputs.timestamp }}
          lookup-only: true

      - name: Check if marine was already processed
        id: marine_marker
        if: steps.checker.outputs.timestamp != ''
        uses: actions/cache/restore@v6
        with:
          path: .processed-marker
          key: processed-marine-${{ steps.checker.outputs.timestamp }}
          lookup-only: true

      - name: Decide what to process
        id: decide
        env:
          TS: ${{ steps.checker.outputs.timestamp }}
          WIND_DONE: ${{ steps.wind_marker.outputs.cache-hit }}
          MARINE_DONE: ${{ steps.marine_marker.outputs.cache-hit }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          need_wind=false
          need_marine=false
          if [ -z "$TS" ]; then
            echo "No new complete data available."
          else
            if [ "$FORCE" = "true" ] || [ "$WIND_DONE" != "true" ]; then need_wind=true; fi
            if [ "$FORCE" = "true" ] || [ "$MARINE_DONE" != "true" ]; then need_marine=true; fi
            echo "Run $TS: wind needed=$need_wind, marine needed=$need_marine"
          fi
          echo "need_wind=$need_wind" >> $GITHUB_OUTPUT
          echo "need_marine=$need_marine" >> $GITHUB_OUTPUT

  wind:
    needs: check
    if: ${{ needs.check.outputs.need_wind == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TS: ${{ needs.check.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build processor image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: aladin-processor:latest
          cache-from: type=gha,scope=processor
          cache-to: type=gha,mode=max,scope=processor

      - name: Simulate a wind failure (dry run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.simulate == 'wind' }}
        run: |
          echo "Simulated wind failure"
          exit 1

      - name: Create data directory
        run: mkdir -p data

      - name: Process GRIB files
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data:/data \
            -e OUTDIR=/data \
            -e ALADIN_RUN_TIMESTAMP="$TS" \
            aladin-processor:latest \
            python3 /app/load_and_merge_gribs.py
        timeout-minutes: 30

      - name: List generated files
        run: ls -lh data/

      - name: Validate the wind GRIB
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data:/data \
            aladin-processor:latest \
            python3 /app/grib_validate.py wind "/data/aladin_adriacenter_${TS}.grb" "$TS"

      - name: Upload wind files
        uses: actions/upload-artifact@v7
        with:
          name: wind
          path: |
            data/aladin_adriacenter_${{ needs.check.outputs.timestamp }}.grb
            data/aladin_wind_${{ needs.check.outputs.timestamp }}.png
          if-no-files-found: warn
          overwrite: true
          retention-days: 1

  marine:
    needs: check
    if: ${{ needs.check.outputs.need_marine == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TS: ${{ needs.check.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build processor image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: aladin-processor:latest
          cache-from: type=gha,scope=processor

      - name: Simulate a marine failure (dry run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.simulate == 'marine' }}
        run: |
          echo "Simulated marine failure"
          exit 1

      - name: Create data directory
        run: mkdir -p data

      - name: Build the marine GRIB
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data:/data \
            -e OUTDIR=/data \
            -e COPERNICUSMARINE_SERVICE_USERNAME \
            -e COPERNICUSMARINE_SERVICE_PASSWORD \
            aladin-processor:latest \
            python3 /app/marine_grib.py --timestamp "$TS"
        timeout-minutes: 15

      - name: List generated files
        run: ls -lh data/

      - name: Upload marine files
        uses: actions/upload-artifact@v7
        with:
          name: marine
          path: |
            data/copernicus_adriacenter_${{ needs.check.outputs.timestamp }}.grb
            data/marine_meta.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 1

  publish:
    needs: [check, wind, marine]
    # !cancelled() instead of the default success(): a failed or skipped wind/marine job must not stop publishing.
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.check.outputs.need_wind == 'true' || needs.check.outputs.need_marine == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TS: ${{ needs.check.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout the published site
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: prev

      - name: Download wind files
        if: ${{ needs.wind.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: wind
          path: artifacts/wind

      - name: Download marine files
        if: ${{ needs.marine.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: marine
          path: artifacts/marine

      - name: Assemble the site
        id: site
        run: |
          python3 build_site.py \
            --ts "$TS" \
            --wind-result "${{ needs.wind.result }}" \
            --marine-result "${{ needs.marine.result }}" \
            --prev prev \
            --wind artifacts/wind \
            --marine artifacts/marine \
            --out site

      - name: Upload the assembled site (dry run or non-main branch)
        if: ${{ env.DEPLOY != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          overwrite: true
          retention-days: 3

      - name: Deploy to GitHub Pages
        id: deploy
        if: ${{ env.DEPLOY == 'true' && steps.site.outputs.changed == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Prepare the processed marker
        if: ${{ env.DEPLOY == 'true' && (steps.deploy.outcome == 'success' || steps.site.outputs.changed == 'false') }}
        run: echo "$TS" > .processed-marker

      - name: Remember the processed wind run
        if: ${{ env.DEPLOY == 'true' && (steps.deploy.outcome == 'success' || steps.site.outputs.changed == 'false') && steps.site.outputs.save_wind_marker == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .processed-marker
          key: processed-${{ needs.check.outputs.timestamp }}

      - name: Remember the processed marine run
        if: ${{ env.DEPLOY == 'true' && (steps.deploy.outcome == 'success' || steps.site.outputs.changed == 'false') && steps.site.outputs.save_marine_marker == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .processed-marker
          key: processed-marine-${{ needs.check.outputs.timestamp }}
