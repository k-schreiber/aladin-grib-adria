version: '3.8'

services:
  aladin:
    build: .
    container_name: aladin-grib-processor
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - OUTDIR=/data
      - PORT=8080
      - COPERNICUSMARINE_SERVICE_USERNAME=${COPERNICUSMARINE_SERVICE_USERNAME:-}
      - COPERNICUSMARINE_SERVICE_PASSWORD=${COPERNICUSMARINE_SERVICE_PASSWORD:-}
    restart: unless-stopped